<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#0d1b38" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Cyber Circuit Ring -->
  <circle cx="32" cy="32" r="23" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="8 4 2 4" stroke-opacity="0.4" />

  <!-- AIMERS Stylized 'A' Emblem -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M32 14L18 48H25L29 38H35L39 48H46L32 14Z" fill="url(#glowGrad)" fill-opacity="0.9" />
    
    <!-- Inner Cutout -->
    <path d="M32 23L34.5 32H29.5L32 23Z" fill="#070d1e" />

    <!-- Crossbar Circuit Pulse -->
    <line x1="24" y1="35" x2="40" y2="35" stroke="url(#coreGrad)" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Central AI Core Node -->
    <circle cx="32" cy="35" r="3.2" fill="#ffffff" />
    <circle cx="32" cy="35" r="5" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- Apex Glowing Beacon -->
  <circle cx="32" cy="14" r="2" fill="#38bdf8" filter="url(#glow)" />
</svg>
